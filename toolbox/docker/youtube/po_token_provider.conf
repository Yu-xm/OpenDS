[program:po-token-provider]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",NO_PROXY="127.0.0.1,localhost",no_proxy="127.0.0.1,localhost"
command=nice -n 10 /usr/local/bin/node /opt/toolbox/bgutil/build/main.js --port %(ENV_BGUTIL_POT_PORT)s
directory=/opt/toolbox/bgutil
autostart=%(ENV_AUTOSTART_BGUTIL_POT)s
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=40
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/po-token-provider.log
redirect_stderr=true
