[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opends-world"
version = "0.1.0"
description = "A small controlled-search runner for OpenDS-World and OpenDS-World-Text."
requires-python = ">=3.10,<3.14"
dependencies = [
    "agent-sandbox==0.0.30",
    "docker>=7.1,<8",
    "httpx>=0.27,<1",
    "pyarrow>=15,<22",
    "PyYAML>=6.0,<7",
]

[project.scripts]
opends-world = "opends_world.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["opends_world*", "toolbox*"]
exclude = ["toolbox.tests*"]

[tool.setuptools.package-data]
toolbox = [
    "docker/browser/Dockerfile",
    "docker/youtube/*",
]
